name: Deploy to GitHub Pages

on:
  push:
    branches:
      - "claude/app-showcase-site-G5HIK"
      - "claude/social-network-platform-rpfk1n"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Variable de dépôt (Settings > Secrets and variables > Actions >
          # Variables) : quand PAGES_CUSTOM_DOMAIN vaut "tiklive.eu", le site
          # est construit pour être servi sur tiklive.eu/reseau.
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          # Secrets du dépôt : connexion à la base Supabase (comptes réels).
          # Sans eux, le site fonctionne en mode démo (stockage local).
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare site directory
        env:
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          if [ -n "$PAGES_CUSTOM_DOMAIN" ]; then
            # Domaine personnalisé : l'app vit sous /reseau, la racine redirige.
            mkdir -p site/reseau
            cp -r out/. site/reseau/
            echo "$PAGES_CUSTOM_DOMAIN" > site/CNAME
            cp out/404.html site/404.html
            cat > site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr">
            <head>
              <meta charset="utf-8" />
              <meta http-equiv="refresh" content="0; url=/reseau/" />
              <title>TikLive</title>
            </head>
            <body>
              <p><a href="/reseau/">Accéder à TikLive</a></p>
            </body>
          </html>
          EOF
          else
            mkdir -p site
            cp -r out/. site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
